{{ define "main" }}
<div class="container py-5">
    <h1 class="text-center mb-5">{{ .Title }}</h1>
    {{- $certifications := .Site.Params.certifications -}}
    <div class="row justify-content-center">
        {{ range $certifications.items }}
        <div class="col-lg-4 col-md-6 my-3">
            {{ if .url }}
            <a class="card my-3 h-100 p-3 shadow-sm border-0" href="{{ .url }}" title="{{ .title }}" target="_blank" style="text-decoration: none; transition: transform 0.2s;">
                {{ if .image }}
                <div class="card-head text-center">
                    <img class="img-fluid mb-3" src="{{ .image | relURL }}" style="max-height: 100px;">
                </div>
                {{ end }}
                <div class="card-body p-0 text-center">
                    <h5 class="card-title text-dark">{{ .title }}</h5>
                    <p class="card-text text-muted small">{{ .content }}</p>
                </div>
            </a>
            {{ else }}
            <div class="card my-3 h-100 p-3 shadow-sm border-0 text-center">
                {{ if .image }}
                <div class="card-head">
                    <img class="img-fluid mb-3" src="{{ .image | relURL }}" style="max-height: 100px;">
                </div>
                {{ end }}
                <div class="card-body p-0">
                    <h5 class="card-title text-dark">{{ .title }}</h5>
                    <p class="card-text text-muted small">{{ .content }}</p>
                </div>
            </div>
            {{ end }}
        </div>
        {{ end }}
    </div>
</div>

<style>
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
    }
</style>
{{ end }}
