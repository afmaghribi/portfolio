  # Hero
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Ahmad Fauzzan Maghribi"
    subtitle: "Cloud Engineer"
    content: |-
      I am a Cloud Engineer with experience in OpenStack, AWS, and GCP, focusing on Kubernetes security and infrastructure automation. I enjoy learning and working with modern technologies to build systems that are secure, scalable, and resilient.
    image: /images/me.jpg
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: true
      name: "Resume"
      url: "/resume.pdf"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/afmaghribi
        - icon: fab fa-linkedin
          url: https://linkedin.com/in/afmaghribi
        - icon: fas fa-award
          url: https://www.credly.com/users/ahmad-fauzzan-maghribi

  # About
  about:
    enable: false
    title: "About Me"
    image: "/images/me.jpg"
    content: |-
      I am a Cloud Engineer with 3+ years of expertise in managing and optimizing private and public cloud environments using OpenStack, AWS, and Google Cloud Platform (GCP).

      Currently, I work as an L2 Cloud Operation Engineer at PT. Boer Technology (Btech), where I specialize in cloud architecture, infrastructure automation, and Kubernetes security. I am also an instructor at ADINUSA, teaching Linux and network security to professional audiences.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "OpenStack"
        - "Kubernetes (CKS, CKA, CKAD)"
        - "AWS & GCP (Professional Cloud Engineer)"
        - "Ansible & Terraform"
        - "Prometheus & Grafana"
        - "Python & Bash"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - company: "Professional"
        jobs:
          - name: "L2 Cloud Operation Engineer at Btech"
            date: "Aug 2023 - present"
            content: |-
              * Execute and oversee production-level configuration changes for private cloud components.
              * Mentor and provide technical guidance to L1 Cloud Engineers.
              * Lead troubleshooting and root cause analysis for critical infrastructure issues.
          - name: "L1 Cloud Operation Engineer at Btech"
            date: "Jun 2021 - Aug 2023"
            content: |-
              * Managed private cloud infrastructure (OpenStack, Ceph) and monitoring systems (Prometheus, Grafana, ELK).
              * Deployed and maintained Kubernetes clusters and automated repetitive tasks using Ansible and Python.
              * Mitigated risks within defined SLAs and generated detailed monthly performance reports.
          - name: "Mentor and Instructor at ADINUSA"
            date: "Jul 2021 - Jan 2023"
            content: |-
              * Instructed CompTIA (Network+, Security+, PenTest+) and Linux Foundation (LFCA, LFCS) courses for professional and student audiences.
          - name: "Network Engineer at PT. Graha Karya Informasi"
            date: "Aug 2019 - Dec 2019"
            content: |-
              * Installed and maintained IT network appliances in branch offices.

      - company: "Internships"
        jobs:
          - name: "Core Network Operation at PT Telkom Indonesia"
            date: "Aug 2020 - Sep 2020"
            content: |-
              * Analyzed backbone enterprise-grade network appliances and topologies.
          - name: "Network Engineer at BLC Telkom - KPLI Klaten"
            date: "Nov 2015 - Feb 2016"
            content: |-
              * Trained high school students in networking and cloud computing fundamentals.

      - company: "Projects"
        jobs:
          - name: "Cybersecurity Challenge Author & Judge"
            date: "2022 - Present"
            content: |-
              * **Lead Challenge Author (Pwn/Binary Exploitation)** for national CTFs: **TSA Cyber Champion 2024**, **Compfest CTF 2023**, and **0byteCTF (2023 & 2024)**.
              * **Technical Judge & Platform Architect** for **Cyber Security Hackathon (2022-2023)** and **LKS Bogor 2023**, managing assessment and server hardening challenges.

  # Education
  education:
    enable: false
    # title: "Custom Name"
    index: false
    items:
      - title: "Bachelor of Telecommunication Engineering"
        school:
          name: "Telkom Purwokerto Institute of Technology"
          url: "https://ittelkom-pwt.ac.id"
        date: "Nov 2017 - Mar 2021"
        GPA: "3.74 out of 4.00 (Cum Laude)"
        content: |-
          * Graduated in 7 semesters with cum laude honor.
          * Head of Internetworking subdivision unit in IPTEK student activity unit.
          * Laboratory assistant for Advanced Programming, Computer Networking, and Network Security subjects.

