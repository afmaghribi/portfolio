  # Hero
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Ahmad Fauzzan Maghribi"
    subtitle: "Cloud Engineer & Kubernetes Specialist"
    content: "Experienced Cloud Engineer with 3+ years of expertise in managing and optimizing private and public cloud environments using OpenStack, AWS, and GCP. Skilled in infrastructure automation and security."
    image: /images/gw_op.jpg
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: true
      name: "Resume"
      url: "/resume.pdf"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/afmaghribi
        - icon: fab fa-linkedin
          url: https://linkedin.com/in/afmaghribi
        - icon: fas fa-award
          url: https://www.credly.com/users/afmaghribi
      # customIcons:
      #   - icon: fab fa-linkedin
      #     url: https://linkedin.com/in/afmaghribi

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/gw.jpg"
    content: |-
      I am a Cloud Engineer with 3+ years of expertise in managing and optimizing private and public cloud environments using OpenStack, AWS, and Google Cloud Platform (GCP).

      Currently, I work as an L2 Cloud Operation Engineer at PT. Boer Technology (Btech), where I specialize in cloud architecture, infrastructure automation, and Kubernetes security. I am also an instructor at ADINUSA, teaching Linux and network security to professional audiences.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "OpenStack"
        - "Kubernetes (CKS, CKA, CKAD)"
        - "AWS & GCP (Professional Cloud Engineer)"
        - "Ansible & Terraform"
        - "Prometheus & Grafana"
        - "Python & Bash"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - company: "Experience"
        jobs:
          - name: "L2 Cloud Operation Engineer at Btech"
            date: "Aug 2023 - present"
            content: |-
              * Execute configuration changes at the production level of private cloud components.
              * Assist other teams when making configuration changes at the production level that impact the cloud environment.
              * Provide direction and guidance to L1 Cloud Engineers.
              * Monitor every action L1 Cloud Engineers take in the private cloud environment.
              * Troubleshoot critical issues that cannot be resolved by L1 Cloud Engineers.
          - name: "L1 Cloud Operation Engineer at Btech"
            date: "Jun 2021 - Aug 2023"
            content: |-
              * Managed private cloud using OpenStack (IaaS), Ceph (Storage Cluster), Grafana & Prometheus/Victoriametrics, Graylog & Elasticsearch, Zabbix, Juju (Deployment tool), and MAAS (Physical server management).
              * Deployed, configured, and maintained Kubernetes clusters inside the cloud environment.
              * Monitored all private cloud components, anticipated and mitigated risks within defined SLAs, and generated monthly reports.
              * Responded to alerts from monitoring systems and coordinated with developer, network, or hardware teams for issue resolution.
              * Researched to optimize cloud resource utilization, balancing performance or enabling/changing features, and created Technical Documents (TD) and Methods of Procedure (MOP).
              * Troubleshot and created Root Cause Analysis (RCA) for any issues in the private cloud components.
              * Automated repetitive tasks using Bash, Python, or Ansible.
          - name: "Mentor and Instructor at ADINUSA"
            date: "Jul 2021 - Jan 2023"
            content: |-
              * Acted as a mentor and instructor for CompTIA Network+, Linux+, Security+, and PenTest+ courses for Vocational High School and Undergraduate students.
              * Instructor for LFCA (Linux Foundation Certified IT Associate) and LFCS (Linux Foundation Certified System Administrator) courses for professional audiences.
          - name: "Network Engineer at PT. Graha Karya Informasi"
            date: "Aug 2019 - Dec 2019"
            content: |-
              * Installation, maintenance, and dismantling of IT network appliances in branch offices.

      - company: "Internship"
        jobs:
          - name: "Core Network Operation at PT Telkom Indonesia"
            date: "Aug 2020 - Sep 2020"
            content: |-
              * Learned backbone enterprise-grade network appliances, topology, and monitoring tools.
          - name: "Network Engineer at BLC Telkom - KPLI Klaten"
            date: "Nov 2015 - Feb 2016"
            content: |-
              * Learned about computer networking, wireless networking, cloud computing, and system administration.
              * Installed network appliances and assisted in training high school students for their final practical tests.

      - company: "Projects"
        jobs:
          - name: "Challenge Author at TSA Cyber Champion 2024"
            date: "Nov 2024 - Nov 2024"
            content: |-
              * Create cybersecurity challenges for pwn/binary exploitation category for the national competition organized by Ministry of Communication and Informatics.
          - name: "Challenge Author at 0byteCTF"
            date: "Aug 2023 - Aug 2024"
            content: |-
              * Created cybersecurity challenges for the pwn/binary exploitation category for the Zerobyte.id Community.
          - name: "Challenge Author & Judge at Cyber Security Hackathon"
            date: "Oct 2022 - May 2023"
            content: |-
              * Create cybersecurity challenges in several categories such as cryptography, reverse engineering, cloud native exploitation and binary exploitation.
              * Design and maintain competition platforms and judge the participant works.

