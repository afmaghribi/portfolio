        content: "Finalist - Top 30 Individual at National Competition for public and professionals. Solved Digital forensics and binary exploitation challenges. (Aug 2025)"
        image: /images/achievement.jpg
      - title: "Gemastik XIII Cyber Security Division"
        content: "Finalist - Top 15 Team at National competition for computer science undergraduate student. Solved cryptography, reverse engineering and binary exploitation challenges. (Nov 2020)"
        image: /images/achievement.jpg
      - title: "Finalist National Mikrotik Networking Olympiad"
