            date: "Nov 2017 - Mar 2021"
            content: |-
              * **Telkom Purwokerto Institute of Technology** (GPA: 3.74/4.00, Cum Laude)
              * Laboratory assistant for Advanced Programming, Computer Networking, and Network Security.
              * Head of Internetworking subdivision in IPTEK student activity unit.

      - provider: "Google Cloud"
        programs:
          - name: "Google Get Certified Program - Professional Cloud Engineer"
            date: "Nov - Dec 2025"
            content: "Focused on designing, developing, and managing robust, secure, scalable, and highly available solutions on GCP."
          - name: "Google Get Certified Program - Associate Cloud Engineer"
            date: "April - June 2024"
            content: "Covered deploying applications, monitoring operations, and managing enterprise solutions on Google Cloud Platform."

      - provider: "Digitalent Scholarship"
        programs:
          - name: "AWS Cloud Operations / Developing"
            date: "2021 - 2022"
            content: "Hands-on training in managing AWS infrastructure, security, and cloud-native application development."
          - name: "Red Hat OpenStack Administrator Training"
            date: "Jul - Sep 2020"
            content: "Intensive program on managing private cloud infrastructure using Red Hat OpenStack Platform."
          - name: "Associate Cloud Engineer / Junior Network Admin"
            date: "2019"
            content: "Foundational training in cloud infrastructure and enterprise network administration."

      - provider: "IT Professional"
        programs:
          - name: "Cloud Native Developer IT Professional Program"
            date: "May - Oct 2024"
            content: "Comprehensive program covering Kubernetes, Docker, and DevOps methodologies for cloud-native development."

